name: taps

on:
  schedule:
    # 10:17 and 18:17 Asia/Yerevan (UTC+4); off the top of the hour on purpose
    - cron: "17 6 * * *"
    - cron: "17 14 * * *"
  workflow_dispatch:

# One run at a time; a queued run waits, a running one is never cancelled
concurrency:
  group: taps
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # A failed browser install must not block the shops: run.py alerts and skips Untappd instead
      - run: python -m playwright install --with-deps chromium
        continue-on-error: true

      - run: |
          git config user.name "taps-bot"
          git config user.email "taps-bot@users.noreply.github.com"

      - run: python -m taps run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_ADMIN_CHAT_ID }}
          SITE_URL: ${{ vars.SITE_URL }}
          TAPS_DEBUG_DIR: ${{ runner.temp }}/taps-debug

      # Publish whatever site/data.json the run produced, even if the run failed later
      - if: always() && hashFiles('site/data.json') != ''
        uses: actions/configure-pages@v5

      - if: always() && hashFiles('site/data.json') != ''
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - if: always() && hashFiles('site/data.json') != ''
        id: deploy
        uses: actions/deploy-pages@v4

      - if: always()
        name: taps-debug
        uses: actions/upload-artifact@v4
        with:
          name: taps-debug
          path: ${{ runner.temp }}/taps-debug
          if-no-files-found: ignore
          retention-days: 1
