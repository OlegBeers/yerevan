settings:
  preview_digests: 2
  digest_time: "10:30"        # сводка уходит утренним прогоном (10:35 по Еревану): вечерние обновления собираются в неё
  digest_max_lines: 15
  hot_rating: 3.75
  untappd_daily_pages: 40
  # Временный разовый разгон бюджета Untappd на неделю: чтобы быстрее заполнить рейтинги магазинных
  # пив, до этой даты по Еревану включительно бюджет страниц и лимит поиска магазинных пив за прогон
  # выше обычного; после даты всё само возвращается к обычным значениям (untappd_daily_pages / 8).
  boost_until: "2026-10-01"
  boost_daily_pages: 80
  boost_search_per_run: 45
  # Первые две недели — ежедневно, чтобы быстрее набрать список мест; после этой даты по Еревану
  # включительно отчёт о новых местах сам возвращается к обычной еженедельной (по понедельникам) рассылке.
  discovery_daily_until: "2026-10-08"
